<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Status do Treino</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap">
    <style>
        :root {
            --bg: oklch(15% 0.02 240);
            --surface: oklch(20% 0.02 240);
            --fg: oklch(95% 0.005 240);
            --muted: oklch(60% 0.01 240);
            --border: oklch(30% 0.02 240);
            --accent: oklch(65% 0.18 45); /* Laranja Intenso */
            --accent-muted: oklch(65% 0.18 45 / 0.1);
            
            --font-display: 'Inter', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            padding: 24px 16px 120px;
        }

        header {
            margin-bottom: 32px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.03em;
        }

        .section-label {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 16px;
            display: block;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
        }

        .stat-value {
            font-family: var(--font-mono);
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
            display: block;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        /* Chart Area */
        .chart-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .chart-svg {
            transform: rotate(-90deg);
            width: 160px;
            height: 160px;
        }

        .chart-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 8;
        }

        .chart-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 440; /* 2 * PI * 70 */
            stroke-dashoffset: 176; /* 440 * (1 - 0.6) */
            transition: stroke-dashoffset 1s ease-out;
        }

        .chart-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            margin-top: -10px;
        }

        .chart-percent {
            font-family: var(--font-mono);
            font-size: 32px;
            font-weight: 700;
            display: block;
        }

        .chart-sub {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
        }

        /* Pending List */
        .pending-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pending-item {
            background: var(--surface);
            border-left: 3px solid var(--border);
            padding: 12px 16px;
            border-radius: 4px 12px 12px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pending-info {
            display: flex;
            flex-direction: column;
        }

        .pending-title {
            font-size: 14px;
            font-weight: 600;
        }

        .pending-date {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--muted);
        }

        .pending-status {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* Nav Tab */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 34px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: var(--muted);
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Status do Treino</h1>
        </header>

        <section>
            <span class="section-label">VISÃO GERAL</span>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-value">10</span>
                    <span class="stat-label">Treinos</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">6</span>
                    <span class="stat-label">Concluídos</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value">60%</span>
                    <span class="stat-label">Percentual</span>
                </div>
            </div>
        </section>

        <section>

            <div class="chart-container">
                <svg class="chart-svg" viewBox="0 0 160 160">
                    <circle class="chart-bg" cx="80" cy="80" r="70"></circle>
                    <circle class="chart-progress" cx="80" cy="80" r="70"></circle>
                </svg>
                <div class="chart-info">
                    <span class="chart-percent">60%</span>

        </section>

        <section>

            <div class="pending-list">

                <div class="pending-item">

                    <span class="pending-status">Pendente</span>
                </div>
                <div class="pending-item">
                    <div class="pending-info">
                        <span class="pending-title">Corrida E (55')</span>
                        <span class="pending-date">Terça, 12/05</span>
                    </div>
                    <span class="pending-status">Pendente</span>
                </div>
                <div class="pending-item">
                    <div class="pending-info">
                        <span class="pending-title">Corrida E (40')</span>
                        <span class="pending-date">Quarta, 13/05</span>
                    </div>
                    <span class="pending-status">Pendente</span>
                </div>
            </div>
        </section>
    </div>
