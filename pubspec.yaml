name: run_app
description: "Run App - Planejamento de treinos de corrida"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.6.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  csv: ^6.0.0
  file_picker: ^8.1.4
  fl_chart: ^0.69.0
  lucide_icons: ^0.257.0
  shared_preferences: ^2.3.2
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/runtrack_thumb.svg
    - assets/runtrack_logo.svg
