<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Treino do Dia</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap">
    <style>
        :root {
            --bg: oklch(15% 0.02 240);
            --surface: oklch(20% 0.02 240);
            --fg: oklch(95% 0.005 240);
            --muted: oklch(60% 0.01 240);
            --border: oklch(30% 0.02 240);
            --accent: oklch(65% 0.18 45);
            --accent-muted: oklch(65% 0.18 45 / 0.1);
            
            --font-display: 'Inter', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            padding: 24px 16px 120px;
        }

        header {
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--fg);
            text-decoration: none;
            background: var(--surface);
        }

        h1 {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .section-label {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            display: block;
        }

        /* Guia de Ritmos Card */
        .rhythm-card {
            background: linear-gradient(135deg, var(--surface), oklch(25% 0.02 240));
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }

        .rhythm-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;
            height: 80px;
            background: var(--accent);
            filter: blur(60px);
            opacity: 0.1;
        }

        .rhythm-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .rhythm-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .rhythm-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
        }

        .rhythm-value {
            font-family: var(--font-mono);
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
        }

        .rhythm-desc {
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
            line-height: 1.4;
        }

        /* Série do Dia */
        .series-section {
            margin-bottom: 32px;
        }

        .series-main {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .series-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .series-title {
            font-size: 18px;
            font-weight: 600;
        }

        .series-tag {
            background: var(--accent-muted);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .series-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .series-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .series-bullet {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            margin-top: 8px;
            flex-shrink: 0;
        }

        .series-content {
            font-size: 14px;
            color: var(--fg);
        }

        .series-content strong {
            color: var(--accent);
            font-family: var(--font-mono);
        }

        /* Feedback Area */
        .feedback-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            display: block;
        }

        textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: var(--fg);
            font-family: var(--font-body);
            font-size: 14px;
            resize: none;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .btn-save {
            width: 100%;
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: opacity 0.2s ease;
            margin-bottom: 12px;
        }

        .btn-delete-footer {
            width: 100%;
            background: oklch(35% 0.08 25);
            color: oklch(85% 0.02 25);
            border: 1px solid oklch(45% 0.08 25);
            border-radius: 8px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-save:active, .btn-delete-footer:active {
            opacity: 0.7;
        }

        .btn-delete-header {
            display: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: var(--muted);
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 500;
        }

        .ciclo-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            display: inline-block;
        }

        /* Nav Tab */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 34px; /* Space for home indicator */
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: var(--muted);
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ciclo-tag">Ciclo 1</div>
        <header>
            <div class="header-left">
                <a href="01-planejamento.html" class="back-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </a>
                <h1 id="screen-title">Treino do Dia</h1>
            </div>
            <button class="btn-delete-header" onclick="if(confirm('Deseja excluir este treino permanentemente?')) window.location.href='01-planejamento.html';">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
        </header>

        <div id="workout-content">
            <section>
                <span class="section-label">GUIA DE RITMOS</span>
                <div class="rhythm-card">
                    <div class="rhythm-grid">
                        <div class="rhythm-item">
                            <span class="rhythm-name" id="pace-label">Pace E / L</span>
                            <span class="rhythm-value" id="pace-value">5:49 - 6:35</span>
                        </div>
                        <div class="rhythm-item">
                            <span class="rhythm-name">Esforço</span>
                            <span class="rhythm-value" id="effort-value">Leve</span>
                        </div>
                    </div>
                    <p class="rhythm-desc" id="rhythm-desc">
                        Conversacional. Na rua (subidas), ignore o relógio e foque em manter a respiração controlada.
                    </p>
                </div>
            </section>

            <section class="series-section">
                <span class="section-label">SÉRIE DO DIA</span>
                <div id="series-container">
                    <!-- Dinamicamente preenchido -->
                </div>
            </section>
        </div>

        <section>
            <span class="section-label">REGISTRO</span>
            <div class="feedback-section">
                <label for="feedback">Como foi o treino de hoje?</label>
                <textarea id="feedback" rows="4" placeholder="Ex: Senti um pouco de cansaço no final, mas o pace foi estável..."></textarea>
                <button class="btn-save" onclick="alert('Resultado salvo!')">Salvar Resultado</button>
                <button class="btn-delete-footer" onclick="if(confirm('Deseja excluir este treino permanentemente?')) window.location.href='01-planejamento.html';">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    Deletar Treino
                </button>
            </div>
        </section>
    </div>

    <script>
        const WORKOUTS = {
            'monday': {
                title: 'Segunda-feira, 04/05',
                paceLabel: 'Pace E / T',
                paceValue: '4:55 - 5:40',
                effortValue: 'Moderado',
                rhythmDesc: 'Ritmo de prova. Deve ser desafiador mas sustentável por longos períodos.',
                series: [
                    {
                        title: 'T - TEMPO RUN',
                        tag: 'Aeróbio T',
                        items: [
                            '15 min Aquecimento em Pace E',
                            '20 min em <strong>Pace T</strong> (Ritmo constante)',
                            '5 min Desaquecimento livre'
                        ]
                    },
                    {
                        title: 'Técnico',
                        tag: 'Core',
                        items: [
                            '3x 12 Abdominais Prancha',
                            '3x 10 Elevação Pélvica'
                        ]
                    }
                ]
            },
            'default': {
                title: 'Sábado, 09 de Maio',
                paceLabel: 'Pace E / L',
                paceValue: '5:49 - 6:35',
                effortValue: 'Leve',
                rhythmDesc: 'Conversacional. Na rua (subidas), ignore o relógio e foque em manter a respiração controlada.',
                series: [
                    {
                        title: 'Corrida E (60\')',
                        tag: 'Aeróbio',
                        items: [
                            'Aquecimento livre: 5-10 min',
                            'Corrida principal: <strong>60 min</strong> em Pace E',
                            'Foco: Manter respiração controlada'
                        ]
                    },
                    {
                        title: 'Descanso Ativo',
                        tag: 'Recuperação',
                        items: [
                            'Mobilidade articular leve',
                            'Hidratação e nutrição focada'
                        ]
                    }
                ]
            }
        };

        function loadWorkout() {
            const params = new URLSearchParams(window.location.search);
            const day = params.get('day') || 'default';
            const workout = WORKOUTS[day] || WORKOUTS['default'];

            document.getElementById('screen-title').textContent = workout.title;
            document.getElementById('pace-label').textContent = workout.paceLabel;
            document.getElementById('pace-value').textContent = workout.paceValue;
            document.getElementById('effort-value').textContent = workout.effortValue;
            document.getElementById('rhythm-desc').textContent = workout.rhythmDesc;

            const container = document.getElementById('series-container');
            container.innerHTML = '';

            workout.series.forEach(s => {
                const div = document.createElement('div');
                div.className = 'series-main';
                div.innerHTML = `
                    <div class="series-header">
                        <span class="series-title">${s.title}</span>
                        <span class="series-tag">${s.tag}</span>
                    </div>
                    <div class="series-list">
                        ${s.items.map(item => `
                            <div class="series-item">
                                <div class="series-bullet"></div>
                                <div class="series-content">${item}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        document.addEventListener('DOMContentLoaded', loadWorkout);
    </script>

    <nav class="bottom-nav">
        <a href="01-planejamento.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span class="nav-label">Plano</span>
        </a>
        <a href="02-treino.html" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            <span class="nav-label">Treino</span>
        </a>
        <a href="03-status.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20v-6M6 20V10M18 20V4"></path></svg>
            <span class="nav-label">Stats</span>
        </a>
        <a href="04-upload.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <span class="nav-label">Upload</span>
        </a>
    </nav>
</body>
</html>
